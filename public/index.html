<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>TTS 3D RPG</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:#fff;pointer-events:none}.panel{background:#0f172acc;border:1px solid #ffffff22;border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px)}.small{font-size:11px;opacity:.75}.bar{width:150px;height:8px;background:#334155;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;width:100%;background:#ef4444}.controls{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:space-between;align-items:end;padding:0 16px}.joy{width:120px;height:120px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff33;position:relative}.stick{position:absolute;left:33px;top:33px;width:54px;height:54px;border-radius:50%;background:#ffffff44}.actions{display:flex;gap:10px}.btn{width:70px;height:70px;border:1px solid #ffffff33;border-radius:50%;background:#111827cc;color:white;font-weight:800}.atk{background:#dc2626cc}.menu{position:fixed;right:12px;top:96px;display:flex;flex-direction:column;gap:6px}.mini{border:1px solid #ffffff33;border-radius:10px;background:#0f172acc;color:#fff;padding:8px 10px}.toast{position:fixed;left:50%;top:48%;transform:translate(-50%,-50%);color:white;font-size:30px;font-weight:900;text-shadow:0 3px 12px #000;opacity:0;transition:.15s;pointer-events:none}.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,90vw);max-height:70vh;overflow:auto;padding:18px;border-radius:16px;background:#0b1220ee;border:1px solid #ffffff22;color:white;display:none}.row{display:flex;justify-content:space-between;margin:7px 0}.card button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px}.item{padding:10px;border:1px solid #ffffff18;border-radius:10px;margin:6px 0}.rarity{font-size:11px;opacity:.7}</style></head><body><div id="game"></div><div class="hud"><div class="panel"><b>⚔️ TTS 3D RPG</b><div>Hero · Lv <span id="lvl">1</span> · EXP <span id="exp">0</span>/100</div><div class="bar"><div id="hp" class="fill"></div></div><div class="small">HP <span id="hpText">100 / 100</span> · Gold <span id="gold">0</span></div></div><div class="panel" style="text-align:right"><b id="enemyName">Slime</b><div>Lv 1 · HP <span id="enemyHp">100</span></div><div class="small">ATK <span id="enemyAtk">8</span></div></div></div><div class="menu"><button class="mini" onclick="showCard('stats')">📊 Stats</button><button class="mini" onclick="showCard('bag')">🎒 Inventory</button><button class="mini" onclick="showCard('equip')">⚔️ Equipment</button><button class="mini" onclick="upgrade()">⬆️ Upgrade</button><button class="mini" onclick="gacha()">🎲 Gacha 100G</button><button class="mini" onclick="saveGame()">☁️ Save</button></div><div class="toast" id="toast"></div><div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div><button onclick="hideCard()">ปิด</button></div><div class="controls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="actions"><button class="btn" onclick="skill()">SKILL</button><button class="btn atk" onclick="attack()">ATTACK</button></div></div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';const $=id=>document.getElementById(id),scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd3ff);scene.fog=new THREE.Fog(0x8fd3ff,20,48);const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x446644,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(7,12,6);sun.castShadow=true;scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x58a65c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);for(let i=0;i<35;i++){const o=new THREE.Group(),tr=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.7,7),new THREE.MeshStandardMaterial({color:0x795548}));tr.position.y=.35;o.add(tr);const cr=new THREE.Mesh(new THREE.ConeGeometry(.55+Math.random()*.3,1.6,7),new THREE.MeshStandardMaterial({color:0x2f7d3b}));cr.position.y=1.25;o.add(cr);o.position.set((Math.random()-.5)*42,0,(Math.random()-.5)*42);scene.add(o)}function hero(){const g=new THREE.Group(),b=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.85,5,10),new THREE.MeshStandardMaterial({color:0x4f7cff}));b.position.y=1;b.castShadow=true;g.add(b);const h=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),new THREE.MeshStandardMaterial({color:0xffd1a9}));h.position.y=1.95;g.add(h);const s=new THREE.Mesh(new THREE.BoxGeometry(.12,1,.08),new THREE.MeshStandardMaterial({color:0xe5e7eb,metalness:.8,roughness:.2}));s.position.set(.62,1.3,0);s.rotation.z=-.55;g.add(s);return g}const player=hero();scene.add(player);const enemy=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshStandardMaterial({color:0x62e69c}));enemy.scale.y=.7;enemy.position.set(0,.7,-6);enemy.castShadow=true;scene.add(enemy);let state={level:1,hp:100,maxHp:100,gold:200,exp:0,stats:{str:10,agi:10,vit:10,int:5},equipment:{weapon:'Wooden Sword',armor:'Cloth Armor'},weaponAtk:18,inventory:[{name:'Wooden Sword',type:'Weapon',rarity:'Common',atk:18,level:1},{name:'Cloth Armor',type:'Armor',rarity:'Common',def:5}],loot:[]},eHP=100,moveX=0,moveZ=0,busy=false;function atk(){return state.stats.str+state.weaponAtk+state.level*2}function skillDmg(){return atk()*2+state.stats.int}function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,700)}function ui(){$('hp').style.width=state.hp/state.maxHp*100+'%';$('hpText').textContent=`${state.hp} / ${state.maxHp}`;$('lvl').textContent=state.level;$('exp').textContent=state.exp;$('gold').textContent=state.gold;$('enemyHp').textContent=eHP}function hit(dmg,label){if(busy||eHP<=0)return;busy=true;const crit=Math.random()<.1?2:1;dmg=Math.floor(dmg*crit);eHP=Math.max(0,eHP-dmg);toast(`${crit>1?'CRITICAL! ':''}${label} -${dmg}`);enemy.scale.set(1.2,1.2,1.2);setTimeout(()=>{enemy.scale.set(1,1,1);busy=false},160);if(eHP===0){const gold=15+Math.floor(Math.random()*20),exp=25;state.gold+=gold;state.exp+=exp;drop();toast(`VICTORY! +${gold}G +${exp}EXP`);if(state.exp>=100){state.level++;state.exp-=100;state.maxHp+=20;state.hp=state.maxHp;state.stats.str+=2;state.stats.vit+=1;toast('⭐ LEVEL UP!')}setTimeout(()=>{eHP=100;enemy.position.set(player.position.x,0.7,player.position.z-6);ui()},1000)}ui()}window.attack=()=>hit(atk()+Math.floor(Math.random()*8),'ATTACK');window.skill=()=>hit(skillDmg()+Math.floor(Math.random()*12),'SKILL');function drop(){if(Math.random()<.3){const names=['Iron Sword','Silver Ring','Blue Potion'];const n=names[Math.floor(Math.random()*names.length)];state.inventory.push({name:n,type:n.includes('Sword')?'Weapon':'Item',rarity:'Rare',atk:n.includes('Sword')?28:0});state.loot.push(n);toast('🎁 LOOT: '+n)}}window.showCard=type=>{let title='',body='';if(type==='stats'){title='📊 Character Stats';body=`<div class="row"><span>Level</span><b>${state.level}</b></div><div class="row"><span>STR</span><b>${state.stats.str}</b></div><div class="row"><span>AGI</span><b>${state.stats.agi}</b></div><div class="row"><span>VIT</span><b>${state.stats.vit}</b></div><div class="row"><span>INT</span><b>${state.stats.int}</b></div><div class="row"><span>Total ATK</span><b>${atk()}</b></div><div class="row"><span>Skill Damage</span><b>${skillDmg()}</b></div>`}else if(type==='equip'){title='⚔️ Equipment';body=`<div class="item">Weapon: <b>${state.equipment.weapon}</b><br>ATK +${state.weaponAtk}</div><div class="item">Armor: <b>${state.equipment.armor}</b></div>`}else{title='🎒 Inventory';body=state.inventory.map((x,i)=>`<div class="item"><b>${x.name}</b><br><span class="rarity">${x.rarity} · ${x.type}</span>${x.atk?` · ATK +${x.atk}`:''}<button onclick="equipItem(${i})">${x.type==='Weapon'?'Equip':'Use'}</button></div>`).join('')||'Empty'}$('cardTitle').textContent=title;$('cardBody').innerHTML=body;$('card').style.display='block'};window.hideCard=()=>{$('card').style.display='none'};window.equipItem=i=>{const x=state.inventory[i];if(x.type==='Weapon'){state.equipment.weapon=x.name;state.weaponAtk=x.atk||0;toast('⚔️ EQUIPPED '+x.name);ui();showCard('equip')}};window.upgrade=()=>{const cost=50+state.level*25;if(state.gold<cost){toast('❌ Gold ไม่พอ');return}state.gold-=cost;state.weaponAtk+=5;toast(`⬆️ Weapon +5 ATK (-${cost}G)`);ui()};window.gacha=()=>{if(state.gold<100){toast('❌ Gold ไม่พอ');return}state.gold-=100;const rare=Math.random()<.25,n=rare?['Flame Sword','Dragon Blade','Moon Staff'][Math.floor(Math.random()*3)]:['Iron Sword','Bronze Axe','Leather Armor'][Math.floor(Math.random()*3)],item={name:n,type:n.includes('Armor')?'Armor':'Weapon',rarity:rare?'Epic':'Rare',atk:n.includes('Armor')?0:35};state.inventory.push(item);toast(`🎲 ${rare?'EPIC':'RARE'}: ${n}`);ui();showCard('bag')};window.saveGame=async()=>{localStorage.setItem('tts-save',JSON.stringify(state));try{const r=await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state)});toast(r.ok?'☁️ CLOUD SAVED':'💾 LOCAL SAVED')}catch{toast('💾 LOCAL SAVED')}};async function load(){try{const r=await fetch('/api/load');if(r.ok){const x=await r.json();if(x.level)state=x}}catch{}const l=localStorage.getItem('tts-save');if(l&&!state.level)state=JSON.parse(l);ui()}const joy=$('joy'),stick=$('stick');function jm(e){e.preventDefault();const t=e.touches[0],r=joy.getBoundingClientRect(),x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2,m=40,l=Math.hypot(x,y),k=Math.min(1,m/Math.max(l,1));stick.style.transform=`translate(${x*k}px,${y*k}px)`;moveX=x*k/m;moveZ=y*k/m}function je(){stick.style.transform='';moveX=moveZ=0}joy.addEventListener('touchstart',jm,{passive:false});joy.addEventListener('touchmove',jm,{passive:false});joy.addEventListener('touchend',je);addEventListener('keydown',e=>{if(e.key==='w')moveZ=-1;if(e.key==='s')moveZ=1;if(e.key==='a')moveX=-1;if(e.key==='d')moveX=1;if(e.code==='Space')attack()});addEventListener('keyup',e=>{if('wasd'.includes(e.key))moveX=moveZ=0});const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);player.position.x+=moveX*4*dt;player.position.z+=moveZ*4*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-18,18);player.position.z=THREE.MathUtils.clamp(player.position.z,-18,18);if(Math.abs(moveX)+Math.abs(moveZ)>.05)player.rotation.y=Math.atan2(moveX,moveZ);enemy.rotation.y+=dt;camera.position.lerp(new THREE.Vector3(player.position.x,7.5,player.position.z+10),.08);camera.lookAt(player.position.x,1,player.position.z-3);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});load();</script></body></html>
