<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>TTS 3D RPG</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:#fff;pointer-events:none}.panel{background:#0f172acc;border:1px solid #ffffff22;border-radius:14px;padding:9px 11px;backdrop-filter:blur(8px)}.small{font-size:11px;opacity:.75}.bar{width:150px;height:8px;background:#334155;border-radius:9px;overflow:hidden;margin-top:5px}.fill{height:100%;width:100%;background:#ef4444}.controls{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:space-between;align-items:end;padding:0 16px}.joy{width:120px;height:120px;border-radius:50%;background:#ffffff18;border:1px solid #ffffff33;position:relative}.stick{position:absolute;left:33px;top:33px;width:54px;height:54px;border-radius:50%;background:#ffffff44}.actions{display:flex;gap:10px}.btn{width:72px;height:72px;border:1px solid #ffffff33;border-radius:50%;background:#111827cc;color:white;font-weight:800}.atk{background:#dc2626cc}.menu{position:fixed;right:12px;top:100px;display:flex;flex-direction:column;gap:7px}.mini{border:1px solid #ffffff33;border-radius:10px;background:#0f172acc;color:#fff;padding:9px 12px}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-size:30px;font-weight:900;text-shadow:0 3px 12px #000;opacity:0;transition:.15s;pointer-events:none}.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(330px,90vw);padding:18px;border-radius:16px;background:#0b1220ee;border:1px solid #ffffff22;color:white;display:none}.card h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;margin:6px 0}.card button{width:100%;margin-top:10px;padding:10px;border:0;border-radius:10px}
</style></head>
<body>
<div id="game"></div>
<div class="hud"><div class="panel"><b>⚔️ TTS 3D RPG</b><div>Hero · Lv <span id="lvl">1</span></div><div class="bar"><div id="hp" class="fill"></div></div><div class="small">HP <span id="hpText">100 / 100</span> · Gold <span id="gold">0</span></div></div><div class="panel" style="text-align:right"><b id="enemyName">Slime</b><div>Lv 1 · HP <span id="enemyHp">100</span></div><div class="small">ATK <span id="enemyAtk">8</span></div></div></div>
<div class="menu"><button class="mini" onclick="showCard('stats')">📊 Stats</button><button class="mini" onclick="showCard('bag')">🎒 Inventory</button><button class="mini" onclick="saveGame()">💾 Save</button></div>
<div class="toast" id="toast"></div>
<div class="card" id="card"><h3 id="cardTitle"></h3><div id="cardBody"></div><button onclick="hideCard()">ปิด</button></div>
<div class="controls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="actions"><button class="btn" onclick="skill()">SKILL</button><button class="btn atk" onclick="attack()">ATTACK</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';
const $=id=>document.getElementById(id); const scene=new THREE.Scene(); scene.background=new THREE.Color(0x8fd3ff); scene.fog=new THREE.Fog(0x8fd3ff,20,48);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,100); const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x446644,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(7,12,6);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),new THREE.MeshStandardMaterial({color:0x58a65c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(let i=0;i<35;i++){const o=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.18,.7,7),new THREE.MeshStandardMaterial({color:0x795548}));trunk.position.y=.35;o.add(trunk);const crown=new THREE.Mesh(new THREE.ConeGeometry(.55+Math.random()*.3,1.6,7),new THREE.MeshStandardMaterial({color:0x2f7d3b}));crown.position.y=1.25;o.add(crown);o.position.set((Math.random()-.5)*42,0,(Math.random()-.5)*42);scene.add(o)}
function makeHero(){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.45,.85,5,10),new THREE.MeshStandardMaterial({color:0x4f7cff}));body.position.y=1;body.castShadow=true;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.38,16,12),new THREE.MeshStandardMaterial({color:0xffd1a9}));head.position.y=1.95;head.castShadow=true;g.add(head);const sword=new THREE.Mesh(new THREE.BoxGeometry(.12,1,.08),new THREE.MeshStandardMaterial({color:0xe5e7eb,metalness:.8,roughness:.2}));sword.position.set(.62,1.3,0);sword.rotation.z=-.55;g.add(sword);return g}const player=makeHero();scene.add(player);
const enemy=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshStandardMaterial({color:0x62e69c}));enemy.scale.y=.7;enemy.position.set(0,.7,-6);enemy.castShadow=true;scene.add(enemy);
let state={level:1,hp:100,maxHp:100,gold:0,exp:0,atk:18,skill:35,inventory:['Wooden Sword'],weapon:'Wooden Sword'};let eHP=100,moveX=0,moveZ=0,busy=false;
function toast(t){$('toast').textContent=t;$('toast').style.opacity=1;setTimeout(()=>$('toast').style.opacity=0,600)}
function renderUI(){$('hp').style.width=(state.hp/state.maxHp*100)+'%';$('hpText').textContent=`${state.hp} / ${state.maxHp}`;$('lvl').textContent=state.level;$('gold').textContent=state.gold;$('enemyHp').textContent=eHP}
function hit(dmg,label){if(busy||eHP<=0)return;busy=true;eHP=Math.max(0,eHP-dmg);toast(`${label} -${dmg}`);enemy.scale.set(1.18,1.18,1.18);setTimeout(()=>{enemy.scale.set(1,1,1);busy=false},150);if(eHP===0){state.gold+=10;state.exp+=20;toast('VICTORY! +10 Gold +20 EXP');if(state.exp>=100){state.level++;state.exp-=100;state.maxHp+=20;state.hp=state.maxHp;state.atk+=4;toast('LEVEL UP!')}setTimeout(()=>{eHP=100;enemy.position.set(player.position.x,0.7,player.position.z-6);renderUI()},1000)}renderUI()}
window.attack=()=>hit(Math.floor(state.atk+Math.random()*8),'ATTACK');window.skill=()=>hit(Math.floor(state.skill+Math.random()*12),'SKILL');
function showCard(type){$('card').style.display='block';if(type==='stats'){$('cardTitle').textContent='📊 Character Stats';$('cardBody').innerHTML=`<div class="row"><span>Level</span><b>${state.level}</b></div><div class="row"><span>ATK</span><b>${state.atk}</b></div><div class="row"><span>Skill Damage</span><b>${state.skill}</b></div><div class="row"><span>HP</span><b>${state.hp}/${state.maxHp}</b></div>`}else{$('cardTitle').textContent='🎒 Inventory';$('cardBody').innerHTML=state.inventory.map(x=>`<div class="row"><span>⚔️</span><b>${x}</b></div>`).join('')||'<div>Empty</div>'}}window.showCard=showCard;window.hideCard=()=>{$('card').style.display='none'};
window.saveGame=async()=>{localStorage.setItem('tts-save',JSON.stringify(state));try{await fetch('/api/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(state)});toast('☁️ SAVED')}catch{toast('💾 LOCAL SAVE')}};async function loadGame(){try{const r=await fetch('/api/load');if(r.ok){const x=await r.json();if(x&&x.level)state=x}}catch{}const local=localStorage.getItem('tts-save');if(local&&!state.level){state=JSON.parse(local)}renderUI()}
const joy=$('joy'),stick=$('stick');function joyMove(e){e.preventDefault();const t=e.touches[0],r=joy.getBoundingClientRect(),x=t.clientX-r.left-r.width/2,y=t.clientY-r.top-r.height/2,m=40,l=Math.hypot(x,y),k=Math.min(1,m/Math.max(l,1));stick.style.transform=`translate(${x*k}px,${y*k}px)`;moveX=x*k/m;moveZ=y*k/m}function joyEnd(){stick.style.transform='';moveX=moveZ=0}joy.addEventListener('touchstart',joyMove,{passive:false});joy.addEventListener('touchmove',joyMove,{passive:false});joy.addEventListener('touchend',joyEnd);
addEventListener('keydown',e=>{if(e.key==='w')moveZ=-1;if(e.key==='s')moveZ=1;if(e.key==='a')moveX=-1;if(e.key==='d')moveX=1;if(e.code==='Space')attack()});addEventListener('keyup',e=>{if('wasd'.includes(e.key))moveX=moveZ=0});
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);player.position.x+=moveX*4*dt;player.position.z+=moveZ*4*dt;player.position.x=THREE.MathUtils.clamp(player.position.x,-18,18);player.position.z=THREE.MathUtils.clamp(player.position.z,-18,18);if(Math.abs(moveX)+Math.abs(moveZ)>.05)player.rotation.y=Math.atan2(moveX,moveZ);enemy.rotation.y+=dt;camera.position.lerp(new THREE.Vector3(player.position.x,7.5,player.position.z+10),.08);camera.lookAt(player.position.x,1,player.position.z-3);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});loadGame();
</script></body></html>
